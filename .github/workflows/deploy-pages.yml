name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDPCB-djaDfmWUCz76balbwYhWJD4QAKOo
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: api-sample-20c3a.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: api-sample-20c3a
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: api-sample-20c3a.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '772194196847'
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:772194196847:web:6bc4074b37c297dd389c9a
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-BGF0R1MEND
      NEXT_PUBLIC_BASE_PATH: /serve
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Firebase configuration
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY"
          test -n "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
          test -n "$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
          test -n "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
          test -n "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          test -n "$NEXT_PUBLIC_FIREBASE_APP_ID"
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /serve
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-BGF0R1MEND
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4